title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 17px}.section-title h2{margin:0;font-size:19px}.tag{display:inline-flex;font-size:11px;background:var(--light);color:#4a685b;padding:4px 9px;border-radius:4px;letter-spacing:.2px}.steps{margin:20px 0 0}.step{display:flex;gap:13px;position:relative;padding-bottom:22px}.step:last-child{padding-bottom:0}.step:not(:last-child):before{content:"";position:absolute;left:13px;top:28px;bottom:1px;width:1px;background:var(--line)}.stepnum{flex-shrink:0;width:28px;height:28px;border:1px solid #d6dfd5;display:grid;place-items:center;border-radius:50%;font-size:12px;background:#fff;z-index:1;color:var(--muted)}.step.done .stepnum{background:var(--green);color:#fff;border-color:var(--green)}.step strong{font-size:14px;font-weight:600;display:block}.step small{color:var(--muted);font-size:12px}.note{color:var(--muted);font-size:12px}.divider{border:0;border-top:1px solid var(--line);margin:23px 0}.demo-list{display:grid;gap:10px}.demo-person{padding:13px;border:1px solid var(--line);background:#fff;border-radius:7px;text-align:left;display:flex;gap:12px;align-items:center;color:var(--ink)}.demo-person:hover{background:#f4f6f0}.demo-person small{display:block;font-size:12px;color:var(--muted);margin-top:2px}.demo-banner{background:#fff3d9;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:11px 48px;font-size:12px}.demo-banner button{background:transparent;text-decoration:underline;color:var(--ink)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px;margin-bottom:18px}.field label{font-weight:550;font-size:13px}.field .help{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #ced8cc;border-radius:6px;background:#fff;color:var(--ink);padding:11px 12px}textarea{resize:vertical;min-height:90px}select{min-height:46px}.wide{grid-column:1/-1}.needs-row{display:grid;grid-template-columns:1.3fr 1fr;gap:25px;align-items:center;border-top:1px solid var(--line);padding:20px 0}.needs-row strong{display:block;font-size:14px}.needs-row p{font-size:12px;color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.path-card{padding:0;overflow:hidden}.path-head{padding:25px;border-bottom:1px solid var(--line);background:#f1f5ee}.path-body{padding:25px}.resource-list{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.resource{display:flex;flex-direction:column;min-height:240px}.resource .num{font:38px Georgia,serif;color:#b1c3ad;margin:15px 0}.resource p{font-size:13px;color:var(--muted)}.resource .btn{margin-top:auto}.guide{max-width:800px}.guide ol,.guide ul{padding-left:23px}.guide li{padding-left:5px;margin-bottom:12px}.guide .example{padding:20px;background:#eff3e9;border-radius:8px;margin:20px 0}.guide .example p{margin:0}.progress{height:5px;background:#e4e9df;border-radius:5px;margin:18px 0 8px;overflow:hidden}.progress i{display:block;height:100%;background:#6d997a;border-radius:5px}.log-entry{border-left:2px solid #a9c19f;padding:0 0 0 18px;margin:22px 0}.log-entry small{color:var(--muted)}.log-entry p{white-space:pre-wrap;font-size:14px;margin-top:8px}.empty{border:1px dashed #cbd7c6;border-radius:8px;padding:25px;color:var(--muted);font-size:14px}.footer-tools{margin-top:30px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.footer-tools button{background:transparent;color:var(--muted);font-size:12px;padding:5px}.error{color:#a84831;font-size:13px;padding:12px;background:#fff0ea;border-radius:6px;margin:10px 0}.pill{border:1px solid var(--line);border-radius:30px;padding:5px 11px;font-size:12px;color:var(--muted)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;background:var(--ink);color:white;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw;font-size:13px}#toast.show{opacity:1}.check{display:flex;gap:12px;align-items:start;margin:14px 0;font-size:14px}.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--green)}.rationale{font-size:13px;color:#5f7768;margin:15px 0}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.stat{background:#f2f5ee;padding:15px;border-radius:6px}.stat strong{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}@media(min-width:1500px){.content{padding-top:50px}}@media(max-width:1050px){.sidebar{padding:30px 14px}.layout{grid-template-columns:205px 1fr}.content{padding:30px 26px}.topbar{padding:0 26px}.grid{grid-template-columns:1fr}.resource-list{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1.6fr 1fr}.demo-banner{padding:12px 26px}}@media(max-width:700px){.layout{display:block}.sidebar{height:auto;position:static;border-right:0;padding:18px 20px}.brand small{display:none}.nav{display:flex;overflow:auto;margin-top:20px;gap:5px}.nav button{padding:10px 13px;white-space:nowrap;font-size:12px}.nav span{display:none}.sidebar-bottom{display:none}.topbar{height:52px;padding:0 20px}.content{padding:25px 20px}.hero{grid-template-columns:1fr}.hero-copy{padding:25px}.hero-art{display:none}h1{font-size:33px}.page-title{display:block}.page-title>.btn{margin-top:8px}.form-grid,.resource-list,.needs-row{grid-template-columns:1fr}.needs-row{gap:12px}.card{padding:20px}.demo-banner{padding:10px 20px}.tag{font-size:10px}.page-title .pill{display:inline-block;margin-top:8px}}@media print{.sidebar,.topbar,.footer-tools,.btn,.demo-banner{display:none!important}.layout{display:block}.content{padding:0}.card{break-inside:avoid}.hero-art{display:none}.grid{display:block}.card{margin:12px 0}}
</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>'use strict';
const KEY='ll-growth-path-v1';
const fresh=()=>({version:1,profile:{name:'',experience:'',context:''},needs:{instructions:'',interaction:'',planning:''},priority:'',assessment:false,goal:'',criterion:'',date:'',material:'',prepared:false,rehearsed:false,logs:[]});
let saved=fresh(),state,page='overview',demo=false,guideId='';
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(valid(p))saved=p;}}catch(e){}
state=structuredClone(saved);
function valid(x){return x&&x.version===1&&x.profile&&typeof x.profile.name==='string'&&typeof x.profile.context==='string'&&typeof x.profile.experience==='string'&&x.needs&&['instructions','interaction','planning'].every(k=>['','0','1','2','3'].includes(x.needs[k]))&&['','instructions','interaction','planning'].includes(x.priority)&&['goal','criterion','date','material'].every(k=>typeof x[k]==='string')&&typeof x.assessment==='boolean'&&typeof x.prepared==='boolean'&&typeof x.rehearsed==='boolean'&&(!x.assessment||['instructions','interaction','planning'].includes(x.priority))&&Array.isArray(x.logs)&&x.logs.every(l=>l&&typeof l.fact==='string'&&typeof l.next==='string'&&typeof l.date==='string'&&typeof l.route==='string'&&typeof l.goal==='string'&&typeof l.action==='string'&&typeof l.criterion==='string');}
const routes={
 instructions:{name:'Понятные инструкции',description:'Чтобы ученики понимали, что делать, с кем и сколько времени.',label:'Как давать инструкции',goal:'Дать короткую инструкцию к парному заданию и показать один образец.',criterion:'Отмечу, сколько пар из общего числа начали нужное действие без повторного объяснения за первые 30 секунд.',steps:['Прочитать памятку и выбрать задание','Записать и проговорить инструкцию','Испытать на уроке и записать наблюдение'],content:`<h2>Меньше объяснений — яснее действие</h2><p>Выберите одно парное задание из ближайшего урока. Подготовьте инструкцию до занятия.</p><ol><li><strong>Назовите действие.</strong> Скажите, что ученики должны получить в конце: выбрать ответ, задать три вопроса или договориться о решении.</li><li><strong>Обозначьте роли и время.</strong> Кто начинает? Что делает партнёр? Когда они меняются?</li><li><strong>Покажите один обмен.</strong> Коротко выполните начало задания с учеником, затем дайте группе начать.</li><li><strong>Проверьте действие.</strong> Вместо общего «Понятно?» спросите: «Кто задаёт первый вопрос? Сколько вопросов нужно задать?»</li></ol><div class="example"><h3>Пример инструкции</h3><p>Work in pairs. Student A asks three questions. Student B answers. Then swap roles. You have two minutes. Let’s try the first question together.</p></div><h3>Что наблюдать</h3><p>Заранее выберите критерий: например, число пар, которые начали нужное действие без повторной инструкции за первые 30 секунд. Запишите и число успешных пар, и общее число. Если часть группы не начала, отметьте, что именно пришлось пояснить.</p><p>Наблюдение помогает выбрать следующий шаг. Оно само по себе не доказывает, что ученики усвоили материал.</p>`},
 interaction:{name:'Участие в обсуждении',description:'Чтобы в разговор включались разные ученики, а не только самые активные.',label:'Как вовлечь в парную работу',goal:'Перед общим обсуждением дать время на обдумывание и обмен репликами в парах.',criterion:'В выбранной группе наблюдения отмечу, сколько учеников произнесли хотя бы одну реплику в паре; укажу число из общего количества.',steps:['Выбрать вопрос и подготовить речевые опоры','Спланировать время и очередность реплик','Провести обсуждение и записать наблюдение'],content:`<h2>Дайте каждому место для первой реплики</h2><p>Выберите один вопрос, который обычно обсуждаете со всем классом. Добавьте короткую подготовку перед общим разговором.</p><ol><li><strong>Сначала — подумать.</strong> Дайте минуту, чтобы записать одну мысль или выбрать ответ. Объясните, что затем нужно будет поделиться им с партнёром.</li><li><strong>Затем — обменяться.</strong> Дайте парам две минуты. Обозначьте очередность: сначала A, затем B. Подготовьте два начала реплик, если языковой уровень этого требует.</li><li><strong>После — обсудить вместе.</strong> Предложите назвать мысль партнёра или сравнить ответы. Предупредите об этом до работы.</li></ol><div class="example"><h3>Речевые опоры</h3><p>I think… because…<br>My partner thinks…<br>We agree / disagree about…</p></div><h3>Что наблюдать</h3><p>Выберите несколько учеников, за которыми реально успеете наблюдать. Отмечайте, кто произнёс хотя бы одну содержательную реплику. Не записывайте имена в трекере: достаточно количества и общей заметки.</p><p>Участие — сигнал для анализа организации работы. По одной реплике нельзя оценить качество понимания темы.</p>`},
 planning:{name:'Цель и структура урока',description:'Чтобы задания помогали достигнуть конкретного результата урока.',label:'Как связать цель и задания',goal:'Сформулировать одно действие ученика к концу урока и подобрать задания для его подготовки и проверки.',criterion:'В конце урока предложу короткое задание на заявленное действие и отмечу, сколько учеников выполнили его по заранее выбранному признаку.',steps:['Назвать действие ученика и признак результата','Проверить связь этапов урока с целью','Провести завершающее задание и разобрать результат'],content:`<h2>Начните с того, что сделает ученик</h2><p>Выберите один ближайший урок. Сформулируйте результат через действие, которое можно увидеть или услышать.</p><ol><li><strong>Уточните результат.</strong> Вместо «Пройти тему еды» — «Ученик заказывает два блюда и задаёт один уточняющий вопрос».</li><li><strong>Придумайте проверку.</strong> Какое короткое задание покажет это действие? Какие два-три признака вы будете наблюдать?</li><li><strong>Подберите подготовку.</strong> Какие слова, примеры и тренировка нужны ученикам, чтобы выполнить задание?</li><li><strong>Оставьте время на результат.</strong> Убедитесь, что подготовка не занимает весь урок.</li></ol><div class="example"><h3>Одна связка</h3><p>Результат: сделать заказ.<br>Подготовка: разобрать образец и потренировать уточняющий вопрос.<br>Проверка: короткий диалог без готового текста.</p></div><h3>После урока</h3><p>Запишите результат проверочного задания и решите, какой этап изменить. Учитывайте сложность задачи и степень помощи, а не только количество правильных ответов.</p>`}
};
const nav=[['overview','Обзор','01'],['assessment','Моя отправная точка','02'],['route','Мой маршрут','03'],['resources','Материалы','04'],['journal','Дневник практики','05']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600);}
function persist(){if(demo)return; saved=structuredClone(state);try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){toast('Браузер не сохранил запись. Скачайте копию через «Сохранить в файл».');}}
function currentLogs(){return state.logs.filter(l=>l.route===state.priority&&l.goal===state.goal&&l.criterion===state.criterion);}
function progress(){return [state.assessment,!!state.goal.trim()&&!!state.criterion.trim()&&!!state.date,state.prepared&&state.rehearsed,currentLogs().length>0].filter(Boolean).length;}
function go(p){page=p;guideId='';render();window.scrollTo({top:0,behavior:'smooth'});}
function field(id,label,value,type='text',help=''){return `<div class="field"><label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}" name="${id}" maxlength="5000" required>${esc(value)}</textarea>`:`<input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${type==='date'?'':'maxlength="250"'} required>`}${help?`<span class="help">${help}</span>`:''}</div>`;}
function render(){const name=state.profile.name||'Преподаватель';document.getElementById('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-icon">→</div><div>Мой маршрут<small>TEACHER DEVELOPMENT</small></div></div><nav class="nav" aria-label="Разделы">${nav.map(([id,label,icon])=>`<button data-go="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span aria-hidden="true">${icon}</span>${label}</button>`).join('')}</nav><div class="sidebar-bottom"><strong>Маленький шаг.<br>Заметное изменение.</strong>Личный маршрут развития<br>Проект для Language Link</div></aside><div class="workspace"><header class="topbar"><span>ПРОФЕССИОНАЛЬНОЕ РАЗВИТИЕ</span><div class="person"><div class="avatar" aria-hidden="true">${esc(name[0].toUpperCase())}</div>${esc(name)}</div></header>${demo?`<div class="demo-banner"><span>Учебный пример · ${esc(name)} · записи этого примера не изменяют ваш маршрут</span><button data-action="exit-demo">Вернуться к своему</button></div>`:''}<main class="content" id="main">${pageContent()}<div class="footer-tools"><span class="note">${demo?'Сейчас открыт учебный пример.':'Записи сохраняются только в этом браузере.'}</span><button data-action="export">Сохранить в файл ↓</button><button data-action="import">Загрузить из файла ↑</button><button data-action="print">Печать</button>${!demo?'<button data-action="reset">Начать заново</button>':''}<input id="import-file" type="file" accept="application/json,.json" hidden></div></main></div></div>`;bind();}
function pageContent(){if(page==='assessment')return assessment();if(page==='route')return routeView();if(page==='resources')return resources();if(page==='guide')return guide();if(page==='journal')return journal();return overview();}
function overview(){const done=progress(),has=!!state.priority;return `<div class="page-title"><div><div class="eyebrow">Личное пространство</div><h1>${state.profile.name?`Здравствуйте, ${esc(state.profile.name)}.`:'Развиваться в своём темпе.'}</h1><p class="sub">Одна актуальная цель, подходящие материалы и практика на вашем уроке.</p></div><span class="pill">${has?'Маршрут выбран':'Ваш следующий шаг'}</span></div><section class="hero"><div class="hero-copy"><span class="tag">${has?'ВАШ ПРИОРИТЕТ':'НАЧНИТЕ С СЕБЯ'}</span><h2>${has?routes[state.priority].name:'Что вы хотите изменить<br>на ближайшем уроке?'}</h2><p>${has?routes[state.priority].description:'Не нужно учиться всему сразу. Найдите задачу, которая важна именно сейчас, и соберите свой маршрут.'}</p><button class="btn" data-go="${has?'route':'assessment'}">${has?'Продолжить маршрут':'Определить мою цель'} <span aria-hidden="true">→</span></button></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 300 230"><path d="M28 193 Q58 115 114 150 T225 65" fill="none" stroke="#b1c6a6" stroke-width="24" stroke-linecap="round"/><path d="M28 193 Q58 115 114 150 T225 65" fill="none" stroke="#f6f8f0" stroke-width="2" stroke-dasharray="7 8"/><circle cx="28" cy="193" r="9" fill="#285f50"/><circle cx="152" cy="149" r="8" fill="#e6b463"/><path d="M225 79V26M225 26l44 10-44 14" fill="#285f50" stroke="#285f50" stroke-width="3"/><path d="M53 84c-15-18 10-25 14-5 9-18 30-6 10 8" fill="#c4d4b9"/><circle cx="193" cy="36" r="4" fill="#e6b463"/></svg></div></section><div class="grid"><section class="card"><div class="section-title"><h2>От цели к практике</h2><span class="tag">${done} из 4 шагов</span></div><p class="note">Отмечаем ход работы, а не уровень вашего мастерства.</p><div class="progress" aria-label="Выполнено ${done} из 4 шагов"><i style="width:${done*25}%"></i></div><div class="steps">${[['Отправная точка','Выберите актуальную потребность',state.assessment],['Личный план','Цель, признак результата и дата',!!state.goal.trim()&&!!state.criterion.trim()&&!!state.date],['Подготовка','Материал и репетиция приёма',state.prepared&&state.rehearsed],['Проба и следующий шаг','Наблюдение после урока',currentLogs().length>0]].map(([t,d,b],i)=>`<div class="step ${b?'done':''}"><div class="stepnum">${b?'✓':i+1}</div><div><strong>${t}</strong><small>${d}</small></div></div>`).join('')}</div></section><section class="card"><div class="eyebrow">Посмотреть, как это работает</div><h2>Разные потребности.<br>Разные маршруты.</h2><p class="sub" style="font-size:13px">Два учебных профиля. Выбор зависит от задачи преподавателя, а не от его стажа.</p><div class="demo-list"><button class="demo-person" data-demo="anna"><span class="avatar">А</span><span><strong>Анна</strong><small>Начинает преподавать · инструкции</small></span></button><button class="demo-person" data-demo="maria"><span class="avatar">М</span><span><strong>Мария</strong><small>10 лет опыта · участие учеников</small></span></button></div><hr class="divider"><p class="note">Заполнение → короткая подготовка → проба на уроке → наблюдение → решение, что делать дальше.</p></section></div>`;}
function assessment(){return `<div class="page-title"><div><div class="eyebrow">Шаг 1 · Самооценка</div><h1>Моя отправная точка</h1><p class="sub">Ответьте, что сейчас получается, а где нужна опора. Здесь нет экзамена и проходного балла.</p></div></div><form id="assessment-form" class="card"><div class="form-grid">${field('name','Как к вам обращаться',state.profile.name)}<div class="field"><label for="experience">Опыт преподавания</label><select id="experience" required><option value="">Выберите</option>${['Пока нет опыта','До 2 лет','2–5 лет','Более 5 лет'].map(v=>`<option ${state.profile.experience===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="wide">${field('context','С кем вы работаете сейчас?',state.profile.context,'textarea','Например: подростки A2, группа из 12 человек, очные занятия.')}</div></div><h2>Что происходит на ваших уроках?</h2><p class="note">Если ещё не преподавали, выберите «Нужен пример и поддержка» для задач, которые хотите освоить первыми.</p>${Object.entries(routes).map(([k,r])=>`<div class="needs-row"><div><strong>${r.name}</strong><p>${r.description}</p></div><label><span class="note">Насколько уверенно получается?</span><select id="need-${k}" required><option value="">Выберите ответ</option>${[['3','Нужен пример и поддержка'],['2','Пробую, но часто возникают трудности'],['1','Обычно получается, хочу улучшить'],['0','Сейчас не приоритет']].map(([v,t])=>`<option value="${v}" ${state.needs[k]===v?'selected':''}>${t}</option>`).join('')}</select></label></div>`).join('')}<p class="note">Рекомендация — отправная точка для обсуждения. При одинаковых ответах вы сами выбираете, что важнее сейчас. Опыт не определяет маршрут автоматически.</p><button class="btn" type="submit">Посмотреть рекомендацию →</button></form>`;}
function routeView(){if(!state.assessment)return `<div class="page-title"><div><div class="eyebrow">Личный маршрут</div><h1>Сначала — ваша задача.</h1><p class="sub">Короткая самооценка поможет выбрать подходящий маршрут.</p></div></div><button class="btn" data-go="assessment">Заполнить самооценку</button>`;const key=state.priority,rr=routes[key],rank=Object.entries(state.needs).sort((a,b)=>Number(b[1])-Number(a[1])),max=Number(rank[0][1]);return `<div class="page-title"><div><div class="eyebrow">Шаги 2 и 3 · Личный план</div><h1>Мой маршрут</h1><p class="sub">Выберите один приоритет. Запланируйте небольшую пробу, которую можно провести на ближайшем уроке.</p></div></div><div class="grid"><section class="card path-card"><div class="path-head"><span class="tag">ВЫ МОЖЕТЕ ИЗМЕНИТЬ ВЫБОР</span><h2 style="margin-top:16px">${rr.name}</h2><label for="route-select" class="note">Приоритет развития</label><select id="route-select">${Object.entries(routes).map(([k,r])=>`<option value="${k}" ${key===k?'selected':''}>${r.name}</option>`).join('')}</select><p class="rationale">${max===0?'Сейчас вы не отметили выраженных трудностей. Выберите направление для небольшого улучшения.':Number(state.needs[key])===max?`По самооценке здесь нужна наибольшая опора${rank.filter(([,v])=>Number(v)===max).length>1?' — наравне с другими направлениями':''}.`:'Вы выбрали это направление самостоятельно; по самооценке более выраженная потребность есть в другом разделе.'} Уточните выбор с наставником, если это поможет.</p></div><form id="plan-form" class="path-body">${field('goal','Что вы попробуете изменить?',state.goal,'textarea')}${field('criterion','По какому признаку вы оцените результат?',state.criterion,'textarea','Укажите, что наблюдаете и когда. Например: число пар, которые начали работу без повторной инструкции.')}${field('date','Дата пробы на уроке',state.date,'date')}${field('material','Материал или заметка для подготовки',state.material,'textarea','Можно записать название, ссылку или свой план.')}<button type="submit" class="btn">Сохранить план</button></form></section><aside><section class="card"><div class="eyebrow">Подготовка к пробе</div><h2>${rr.label}</h2><p class="note">${rr.description}</p><button class="btn secondary" data-guide="${key}">Открыть памятку →</button><hr class="divider"><label class="check"><input id="prepared" type="checkbox" ${state.prepared?'checked':''}> <span>Прочитал(а) материал и выбрал(а) приём</span></label><label class="check"><input id="rehearsed" type="checkbox" ${state.rehearsed?'checked':''}> <span>Подготовил(а) и проговорил(а) действие для своего урока</span></label><p class="note">После урока запишите, что вы сделали и что произошло у учеников.</p><button class="btn quiet" data-go="journal">Записать пробу →</button></section><p class="note" style="padding:16px 5px">Цель можно изменить. Если меняете направление, записи предыдущих проб сохранятся в дневнике.</p></aside></div>`;}
function resources(){return `<div class="page-title"><div><div class="eyebrow">Практические опоры</div><h1>Небольшой шаг в урок.</h1><p class="sub">Короткие памятки для трёх рабочих задач. Можно выбрать любую, независимо от рекомендации.</p></div></div><div class="resource-list">${Object.entries(routes).map(([k,r],i)=>`<section class="card resource"><span class="tag">ПАМЯТКА · 3–5 МИНУТ</span><div class="num">0${i+1}</div><h2>${r.name}</h2><p>${r.description}</p><button class="btn secondary" data-guide="${k}">Читать памятку →</button></section>`).join('')}</div><p class="note" style="margin-top:22px">Памятки подготовлены для учебного прототипа. Это не официальная программа повышения квалификации Language Link.</p>`;}
function guide(){const rr=routes[guideId];return `<button class="btn quiet" data-go="${state.priority?'route':'resources'}">← Назад</button><article class="card guide" style="margin-top:15px"><div class="eyebrow">Практическая памятка</div>${rr.content}<hr class="divider"><p class="note">Выберите один приём и адаптируйте его к возрасту, уровню языка и задаче своей группы.</p><button class="btn" data-go="${state.assessment?'route':'assessment'}">${state.assessment?'К моему плану':'Собрать свой маршрут'} →</button></article>`;}
function journal(){return `<div class="page-title"><div><div class="eyebrow">Шаг 4 · Наблюдение и рефлексия</div><h1>Дневник практики</h1><p class="sub">Зафиксируйте факты. Даже неудачная проба помогает решить, что изменить на следующем уроке.</p></div></div><div class="grid"><section class="card">${state.priority?`<h2>Новая запись</h2><span class="tag">${routes[state.priority].name}</span><p class="note" style="margin-top:15px">Цель: ${esc(state.goal)}</p><form id="log-form">${field('trial-date','Дата проведённого урока',new Date().toLocaleDateString('en-CA'),'date')}${field('action','Что именно вы сделали?','','textarea')}${field('fact','Что наблюдали по своему критерию?','','textarea','Запишите число из общего количества и контекст либо конкретный наблюдаемый факт. Без имён учеников.')}${field('next','Что сделаете на следующем уроке и почему?','','textarea')}<button type="submit" class="btn">Сохранить наблюдение</button></form>`:`<h2>Начните с плана</h2><p class="sub">Для полезной записи сначала нужна цель и признак результата.</p><button class="btn" data-go="assessment">Выбрать цель</button>`}</section><section class="card"><div class="section-title"><h2>История проб</h2><span class="tag">${state.logs.length} ${state.logs.length===1?'запись':'записей'}</span></div>${state.logs.length?state.logs.slice().reverse().map(l=>`<article class="log-entry"><small>${esc(l.date)} · ${esc(routes[l.route]?.name||l.route)}</small><h3 style="margin-top:7px">${esc(l.goal)}</h3>${l.action?`<p><strong>Действие:</strong> ${esc(l.action)}</p>`:''}<p class="note"><strong>Критерий:</strong> ${esc(l.criterion)}</p><p><strong>Наблюдение:</strong> ${esc(l.fact)}</p><p><strong>Следующий шаг:</strong> ${esc(l.next)}</p></article>`).join(''):'<div class="empty">Здесь появятся ваши наблюдения после первого урока. До этого можно посмотреть учебные примеры на странице обзора.</div>'}</section></div>`;}
function selectRoute(key){if(state.priority&&state.priority!==key&&(state.goal||state.criterion)&&!confirm('Собрать план для нового направления? Текущий черновик заменится, записи проведённых проб останутся.'))return false;state.priority=key;state.goal=routes[key].goal;state.criterion=routes[key].criterion;state.material=routes[key].label;state.date='';state.prepared=false;state.rehearsed=false;return true;}
function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelectorAll('[data-guide]').forEach(e=>e.onclick=()=>{guideId=e.dataset.guide;page='guide';render();window.scrollTo(0,0);});document.querySelectorAll('[data-demo]').forEach(e=>e.onclick=()=>loadDemo(e.dataset.demo));document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action));
const af=document.getElementById('assessment-form');if(af)af.onsubmit=e=>{e.preventDefault();const newNeeds=Object.fromEntries(Object.keys(routes).map(k=>[k,document.getElementById('need-'+k).value]));const key=Object.entries(newNeeds).sort((a,b)=>Number(b[1])-Number(a[1]))[0][0];const old=structuredClone(state);if(!state.priority){selectRoute(key);}state.profile={name:af.querySelector('#name').value.trim(),experience:af.querySelector('#experience').value,context:af.querySelector('#context').value.trim()};if(!state.profile.name||!state.profile.context){state=old;toast('Заполните имя и контекст работы.');return;}state.needs=newNeeds;state.assessment=true;persist();go('route');toast('Самооценка сохранена. Приоритет можно изменить.');};
const pf=document.getElementById('plan-form');if(pf){pf.onsubmit=e=>{e.preventDefault();for(const k of ['goal','criterion','date','material'])state[k]=pf.querySelector('#'+k).value.trim();if(!state.goal||!state.criterion||!state.date||!state.material){toast('Заполните все поля плана.');return;}persist();toast('План сохранён');};pf.querySelectorAll('input,textarea').forEach(el=>el.oninput=()=>{state[el.name]=el.value;persist();});}
const sel=document.getElementById('route-select');if(sel)sel.onchange=()=>{if(selectRoute(sel.value)){persist();render();}else sel.value=state.priority;};for(const k of ['prepared','rehearsed']){const el=document.getElementById(k);if(el)el.onchange=()=>{state[k]=el.checked;persist();};}
const lf=document.getElementById('log-form');if(lf)lf.onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(['trial-date','action','fact','next'].map(k=>[k,lf.querySelector('#'+k).value.trim()]));if(Object.values(values).some(v=>!v)){toast('Заполните все поля наблюдения.');return;}state.logs.push({date:values['trial-date'],action:values.action,fact:values.fact,next:values.next,route:state.priority,goal:state.goal,criterion:state.criterion});persist();render();toast('Наблюдение добавлено');};const imp=document.getElementById('import-file');if(imp)imp.onchange=importState;}
function loadDemo(id){demo=true;state=fresh();state.assessment=true;if(id==='anna'){state.profile={name:'Анна',experience:'Пока нет опыта',context:'Подростки A2, 12 учеников. Учебный профиль.'};state.needs={instructions:'3',interaction:'1',planning:'2'};selectRoute('instructions');state.date='2026-11-18';}else{state.profile={name:'Мария',experience:'Более 5 лет',context:'Подростки B1, 12 учеников. Учебный профиль.'};state.needs={instructions:'0',interaction:'3',planning:'1'};selectRoute('interaction');state.date='2026-11-18';state.prepared=true;state.rehearsed=true;state.logs=[{date:'2026-11-11',route:'interaction',goal:state.goal,criterion:state.criterion,action:'Дала минуту на обдумывание, две минуты на обмен. Предложила два начала реплик.',fact:'Учебные, вымышленные данные: 4 из 6 наблюдаемых учеников высказались. Двое ждали, пока начнёт партнёр.',next:'Явно обозначить очередность A/B и снова понаблюдать за шестью учениками.'}];}page='route';render();window.scrollTo(0,0);}
function action(a){if(a==='exit-demo'){demo=false;state=structuredClone(saved);go('overview');}if(a==='print')window.print();if(a==='reset'&&confirm('Удалить ваш план и наблюдения из этого браузера? Сначала можно сохранить их в файл.')){state=fresh();persist();go('overview');}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=demo?'tracker-example.json':'my-teacher-route.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Файл подготовлен');}if(a==='import')document.getElementById('import-file').click();}
async function importState(e){const f=e.target.files[0];if(!f)return;try{if(f.size>1500000)throw Error();const incoming=JSON.parse(await f.text());if(!valid(incoming))throw Error();if(!confirm('Заменить записи этого браузера содержимым файла?'))return;demo=false;state=incoming;persist();go('overview');toast('Маршрут загружен');}catch(err){toast('Файл не подходит. Выберите JSON, сохранённый из этого трекера.');}}
render();
</script></body></html>
